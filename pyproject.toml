[project]
name = "mlflow-eval-agent"
version = "0.1.0"
description = "MLflow Evaluation Agent - A modular, evaluation-driven agent built with Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.10",
    "mlflow[databricks]>=3.5.1",
    "python-dotenv>=1.0.0",
    "databricks-connect",
    "databricks-sdk",
    "anthropic",
    "nest-asyncio>=1.6.0",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.4.4",
    "pytest-base-url>=2.0.0",
]

[project.scripts]
mlflow-eval = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests (deselect with '-m \"not e2e\"')",
    "visual: visual regression tests",
]
